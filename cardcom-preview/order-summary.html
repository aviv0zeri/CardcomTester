<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order summary</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #f4f5f8;
    color: #14161c;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }
  .card {
    width: 100%;
    max-width: 320px;
    background: #fff;
    border: 1px solid #e1e4ee;
    border-radius: 14px;
    padding: 24px 22px;
    box-shadow: 0 1px 2px rgba(20, 22, 28, 0.05);
  }
  .badge {
    display: inline-block;
    margin: 0 0 14px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eef1f7;
    color: #3d5580;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 18px;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid #eef0f6;
    font-size: 0.92rem;
  }
  .row .name { color: #14161c; }
  .row .qty { color: #8b90a0; font-size: 0.8rem; margin-inline-start: 6px; }
  .row .price { color: #3d4456; white-space: nowrap; }
  .total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 2px solid #14161c;
  }
  .total .label { font-size: 0.95rem; color: #3d4456; font-weight: 600; }
  .total .amount { font-size: 1.5rem; font-weight: 800; }
  .hint {
    margin: 22px 0 0;
    padding: 12px 14px;
    border-radius: 8px;
    background: #eef1f7;
    color: #3d5580;
    font-size: 0.78rem;
    line-height: 1.45;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Your app's own screen</span>
    <h1>Order summary</h1>
    <div class="row">
      <span><span class="name">Monthly plan</span><span class="qty">× 1</span></span>
      <span class="price">₪7.90</span>
    </div>
    <div class="row">
      <span><span class="name">Setup fee</span><span class="qty">× 1</span></span>
      <span class="price">₪2.10</span>
    </div>
    <div class="total">
      <span class="label">Total</span>
      <span class="amount">₪10.00</span>
    </div>
    <p class="hint">
      This screen is yours to design — GateOpen (or any merchant) owns everything up to
      this point. Only the payment step, next to this panel, actually belongs to Cardcom.
    </p>
  </div>
</body>
</html>
