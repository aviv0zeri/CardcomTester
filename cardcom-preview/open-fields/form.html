<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="./form.css">
    <script src="./form.js"></script>
    <script>
        var cardcom3DSScript = document.createElement('script');
        const time = new Date().getTime();
        cardcom3DSScript.setAttribute('src', 'https://secure.cardcom.solutions/External/OpenFields/3DS.js?v=' + time);
        document.head.appendChild(cardcom3DSScript);
    </script>
    <title>Cardcom Example</title>
</head>

<body>
    <!-- brand header, cart/checkout, and the powered-by footer all share ONE
         card now (previously three separately-margined pieces on the page
         background) -- .container carries the box styling; #brand/.footer
         keep their own classes for their existing content rules. -->
    <div class="container app-shell">
        <!-- Which business this checkout belongs to (?brand=<id>, allowlisted
             in form.js -- the tester's business profiles use the same ids). -->
        <header class="brand" id="brand" hidden>
            <img id="brandLogo" alt="" width="32" height="32">
            <span class="brand-text">
                <span id="brandName"></span>
                <span class="brand-suffix"><i class="fa fa-lock" aria-hidden="true"></i><span data-i18n="secure_payment">Secure Payment</span></span>
            </span>
            <!-- Shown only with ?testfill=1 (the tester passes it); fills our
                 own fields with test details. Card number / CVV live in
                 Cardcom's iframes and can't be filled from here, by design. -->
            <button type="button" id="testFill" class="test-fill" data-i18n="test_fill" hidden>Fill test details</button>
        </header>
        <div id="first-screen">
            <div class="summary-container">
                <div class="cart">
                    <h4>Cart <span class="price"><i class="fa fa-shopping-cart"></i> <b>4</b></span></h4>
                    <p><a href="#">Product 1</a> <span class="price">$15</span></p>
                    <p><a href="#">Product 2</a> <span class="price">$5</span></p>
                    <p><a href="#">Product 3</a> <span class="price">$8</span></p>
                    <p><a href="#">Product 4</a> <span class="price">$2</span></p>
                    <hr>
                    <p class="cart-total">Total <span class="price"><b>$30</b></span></p>
                </div>
            </div>
            <input type="button" id="continue" value="Continue to checkout" class="btn">
        </div>
        <div id="second-screen" style="display: none;">
            <div class="checkout">
                <!-- Wallet buttons up top, ahead of manual card entry -- each
                     wallet gets its own .wallet-item so the row's flex-wrap
                     layout (see form.css) spreads 1-4 of them evenly with no
                     JS needed: a lone item grows to fill the row, an odd
                     leftover stretches its own row instead of leaving a gap
                     (same technique as templates/cardcom/low-profile's
                     compact .payment-methods-grid). -->
                <div class="wallet" id="walletRow">
                    <div class="wallet-item">
                        <iframe allow="payment" id="CardComGooglePay" name="CardComGooglePay"
                            src="https://secure.cardcom.solutions/api/openfields/GooglePay?terminalNumber=1000"></iframe>
                    </div>
                </div>
                <form action="" id="form">
                <!-- Billing templates: exactly one is shown, picked by the
                     ?region= query param (us | il | eu). form.js does the
                     switching; us is the default and matches Cardcom's
                     original example. -->
                <section class="block" id="billing-us" data-billing>
                    <h3>Billing address</h3>
                    <div class="fields">
                        <div class="field">
                            <label for="cname">Full name</label>
                            <input type="text" id="cname" name="fname" placeholder="John M. Doe">
                        </div>
                        <div class="field">
                            <label for="cardOwnerEmail">Email</label>
                            <input type="text" id="cardOwnerEmail" name="email" onblur="setCardOwnerDetails()"
                                placeholder="john@example.com">
                        </div>
                        <div class="field field--full">
                            <label for="adr">Address</label>
                            <input type="text" id="adr" name="address" placeholder="542 W. 15th Street">
                        </div>
                        <div class="field--full fields fields--3">
                            <div class="field">
                                <label for="city">City</label>
                                <input type="text" id="city" name="city" placeholder="New York">
                            </div>
                            <div class="field">
                                <label for="state">State</label>
                                <input type="text" id="state" name="state" placeholder="NY">
                            </div>
                            <div class="field">
                                <label for="zip">ZIP</label>
                                <input type="text" id="zip" name="zip" placeholder="10001">
                            </div>
                        </div>
                    </div>
                </section>
                <!-- Israel: the same personal fields the Low Profile
                     checkout collects (name, ID, phone, email) -- no
                     US-style address block. Labels flip to Hebrew (and the
                     page to RTL) when lang=he. -->
                <section class="block" id="billing-il" data-billing style="display: none;">
                    <h3><span data-i18n="il_details">Personal details</span></h3>
                    <div class="fields">
                        <div class="field">
                            <label for="ilFullName"><span data-i18n="il_full_name">Full name</span></label>
                            <input type="text" id="ilFullName" name="ilFullName" onblur="setCardOwnerDetails()"
                                placeholder="ישראל ישראלי">
                        </div>
                        <div class="field">
                            <label for="ilIdNumber"><span data-i18n="il_id">ID number</span></label>
                            <input type="text" id="ilIdNumber" name="ilIdNumber" inputmode="numeric"
                                placeholder="000000000">
                        </div>
                        <div class="field">
                            <label for="ilPhone"><span data-i18n="il_phone">Phone</span></label>
                            <input type="text" id="ilPhone" name="ilPhone" inputmode="tel" onblur="setCardOwnerDetails()"
                                placeholder="0501234567">
                        </div>
                        <div class="field">
                            <label for="ilEmail"><span data-i18n="il_email">Email</span></label>
                            <input type="text" id="ilEmail" name="ilEmail" onblur="setCardOwnerDetails()"
                                placeholder="israel@example.com">
                        </div>
                        <label class="checkbox field--full" for="ilInvoiceToggle">
                            <input type="checkbox" id="ilInvoiceToggle" name="ilInvoiceToggle">
                            <span data-i18n="il_invoice_toggle">I want an invoice / receipt</span>
                        </label>
                        <div class="field--full fields" id="il-invoice-fields" style="display: none;">
                            <div class="field">
                                <label for="ilInvoiceName"><span data-i18n="il_invoice_name">Name on
                                        invoice</span></label>
                                <input type="text" id="ilInvoiceName" name="ilInvoiceName" placeholder="ישראל ישראלי">
                            </div>
                            <div class="field">
                                <label for="ilInvoiceEmail"><span data-i18n="il_invoice_email">Email for the
                                        invoice</span></label>
                                <input type="text" id="ilInvoiceEmail" name="ilInvoiceEmail"
                                    placeholder="israel@example.com">
                            </div>
                        </div>
                    </div>
                </section>
                <!-- Europe: like the US template, but postal code +
                     country instead of state/zip. -->
                <section class="block" id="billing-eu" data-billing style="display: none;">
                    <h3>Billing address</h3>
                    <div class="fields">
                        <div class="field">
                            <label for="euFullName">Full name</label>
                            <input type="text" id="euFullName" name="euFullName" placeholder="Anna Schmidt">
                        </div>
                        <div class="field">
                            <label for="euEmail">Email</label>
                            <input type="text" id="euEmail" name="euEmail" onblur="setCardOwnerDetails()"
                                placeholder="anna@example.com">
                        </div>
                        <div class="field field--full">
                            <label for="euAddress">Address</label>
                            <input type="text" id="euAddress" name="euAddress" placeholder="Hauptstraße 12">
                        </div>
                        <div class="field--full fields fields--3">
                            <div class="field">
                                <label for="euCity">City</label>
                                <input type="text" id="euCity" name="euCity" placeholder="Berlin">
                            </div>
                            <div class="field">
                                <label for="euPostal">Postal code</label>
                                <input type="text" id="euPostal" name="euPostal" placeholder="10115">
                            </div>
                            <div class="field">
                                <label for="euCountry">Country</label>
                                <input type="text" id="euCountry" name="euCountry" placeholder="Germany">
                            </div>
                        </div>
                    </div>
                </section>
                <section class="block">
                    <h3><span data-i18n="payment_title">Payment</span></h3>
                    <div class="fields">
                        <div class="field field--full" id="nameOnCardRow">
                            <label for="cardOwnerName">Name on card</label>
                            <input type="text" id="cardOwnerName" name="cardOwnerName" onblur="setCardOwnerDetails()"
                                placeholder="John More Doe">
                        </div>
                        <div class="field field--full">
                            <div class="label-row">
                                <label for="CardComCardNumber"><span data-i18n="card_number">Card
                                        number</span></label>
                                <span class="brands" aria-hidden="true">
                                    <i class="fa fa-cc-visa"></i>
                                    <i class="fa fa-cc-mastercard"></i>
                                    <i class="fa fa-cc-amex"></i>
                                    <i class="fa fa-cc-discover"></i>
                                </span>
                            </div>
                            <iframe id="CardComMasterFrame" name="CardComMasterFrame"
                                src="https://secure.cardcom.solutions/api/openfields/master"
                                style="display: block;width:0px;height:0px;"></iframe>
                            <iframe id="CardComCardNumber" name="CardComCardNumber"
                                src="https://secure.cardcom.solutions/api/openfields/cardNumber"></iframe>
                        </div>
                        <div class="field--full fields fields--3 expDate">
                            <div class="field expMonth">
                                <label for="expirationMonth"><span data-i18n="exp_month">Month</span></label>
                                <input type="text" id="expirationMonth" name="expirationMonth" value="12"
                                    placeholder="12">
                            </div>
                            <div class="field expYear">
                                <label for="expirationYear"><span data-i18n="exp_year">Year</span></label>
                                <input type="text" id="expirationYear" name="expirationYear" value="30"
                                    placeholder="30">
                            </div>
                            <div class="field cvv">
                                <label class="cvv-label" for="CardComCvv">CVV</label>
                                <iframe id="CardComCvv" name="CardComCvv"
                                    src="https://secure.cardcom.solutions//api/openfields/CVV"></iframe>
                                <!-- Card-back icon over the box's end edge; hover/focus explains
                                     the code (the box itself is Cardcom's iframe). -->
                                <span class="cvv-hint" tabindex="0" role="img"
                                    data-tip="The 3 digits on the back of your card"
                                    data-i18n-tip="cvv_hint" aria-label="The 3 digits on the back of your card">
                                    <svg viewBox="0 0 20 14" width="19" height="13.3" aria-hidden="true">
                                        <rect x="0.75" y="0.75" width="18.5" height="12.5" rx="2.2" fill="none"
                                            stroke="currentColor" stroke-width="1.5" />
                                        <rect x="0.75" y="3.4" width="18.5" height="2.6" fill="currentColor" />
                                        <rect x="9.5" y="8.2" width="7.5" height="3" rx="0.9" fill="none"
                                            stroke="currentColor" stroke-width="1.2" />
                                    </svg>
                                </span>
                            </div>
                        </div>
                    </div>
                </section>
                <!-- Shared across all three billing templates. -->
                <input type="submit" id="submit-btn" value="Pay now" class="btn" data-i18n-value="submit">
                <!-- Outcome of the last Pay attempt (Cardcom's error/result
                     messages), inline instead of alert(). -->
                <p id="payStatus" class="pay-status" role="status" hidden></p>
            </form>
        </div>
        </div>
        <div class="footer">
            <p id="notice" class="notice" hidden></p>
            <!-- Always left-to-right: "Powered by" at the left, Cardcom's own
                 credit small at the right, whatever the page direction. -->
            <div class="footer-row" dir="ltr">
                <a class="powered" href="https://spectra.avivozeri.com" target="_blank" rel="noopener noreferrer">
                    <img src="/cardcom-preview/brand/aviv-ozeri.png" alt="" width="22" height="22">
                    <span>Powered by <strong>Spectra</strong> · Aviv Ozeri</span>
                </a>
                <div class="credits">
                    <!-- credits supported languages: en, he. types: short, long -->
                    <iframe id="CardcomCredits" name="CardcomCredits" title="Cardcom"
                        src="https://secure.cardcom.solutions/api/openfields/credits?language=he&type=short"></iframe>
                </div>
            </div>
        </div>

    </div>
    <div id="loading" style="display: none;">
        <!-- Credit to https://loading.io/css/ -->
        <div class="lds-spinner">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>
</body>

<!-- CSS for the CVV iframe (sent to Cardcom by postMessage; see form.js).
     Must match the page's own inputs and styles/cardNumber.css. -->
<template id="css_template">
    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .cvvField {
            box-sizing: border-box;
            border: 1.5px solid #c7cddd;
            border-radius: 8px;
            height: 39px;
            margin: 0;
            padding: 0 12px;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            color: #14161c;
        }

        .cvvField.invalid{
            border: 1.5px solid #b91c1c;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</template>

</html>
